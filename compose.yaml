# Compose Spec: read by `podman-compose` and `docker compose` alike.
#
# Secrets stay out of the environment and out of this file: the configuration
# is mounted, and it holds the upstream keys and the client keys. Only what
# outlives a restart is a volume, and only non-secret settings are environment
# variables.

services:
  unladen:
    build:
      context: .
      # `docker compose` looks for `Dockerfile` unless the file is named here.
      dockerfile: Containerfile
    image: unladen:local
    container_name: unladen
    restart: unless-stopped

    # Loopback only: the gateway holds upstream keys, and anything that reaches
    # it can spend them. Put a reverse proxy or a tailnet in front for remote
    # use, or publish "4141:4141" on a host you trust.
    ports:
      - "127.0.0.1:4141:4141"

    environment:
      # Not a secret: the zone the usage log is bucketed by.
      TZ: ${TZ:-UTC}

    volumes:
      # $XDG_CONFIG_HOME is /config in the image, so this is
      # /config/unladen/config.jsonc. The directory is mounted, not the file:
      # editors save by writing a new file and renaming it over the old one, and
      # a file mount keeps pointing at the old inode, so a reload after an edit
      # would read the contents as they were before it. It holds `accounts`,
      # `models`, `clients` and `panel`, and uid 65532 must be able to read it
      # (chmod 0644).
      - ./config:/config/unladen:ro
      # Sign-ins (logins.json) and the usage log (usage-YYYY-MM.jsonl). The
      # configuration is the read-only mount above, so the control panel shows
      # it but reports that it cannot write it; edit the file and reload
      # (SIGHUP, or the panel's Reload). To edit in the panel instead, keep the
      # configuration in this volume at /data/unladen/config.jsonc and leave
      # the mount out.
      - unladen-state:/data

    # Nothing in the image needs a capability or a set-uid helper.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  unladen-state:
