# Compose Spec: read by `podman-compose` and `docker compose` alike.
#
# Secrets stay out of the environment and out of this file: the configuration
# is mounted as a secret, and it holds the upstream keys and the client keys.
# Only what outlives a restart is a volume, and only non-secret settings are
# environment variables.

services:
  unladen:
    build: .
    image: ${UNLADEN_IMAGE:-ghcr.io/aisk/unladen:local}
    container_name: unladen
    restart: unless-stopped

    # Loopback only: the gateway holds upstream keys, and anything that reaches
    # it can spend them. Put a reverse proxy or a tailnet in front for remote
    # use, or publish "4141:4141" on a host you trust.
    ports:
      - "127.0.0.1:4141:4141"

    environment:
      # Not a secret: the zone the usage log is bucketed by, and the log level.
      TZ: ${TZ:-UTC}
      LOG_LEVEL: ${LOG_LEVEL:-info}

    secrets:
      # The file holds `accounts`, `models`, `clients` and `panel`, with the
      # keys written out (or as ${VAR} references if you prefer environment).
      # podman-compose mounts it as a bind, so it must be readable by uid 65532
      # (chmod 0644); docker compose mounts it root-owned 0444.
      - source: configuration
        target: /data/unladen/config.jsonc

    volumes:
      # Sign-ins (logins.json) and the usage log (usage-YYYY-MM.jsonl). The
      # configuration beside them is the read-only secret above, so the control
      # panel shows it but reports that it cannot write it; edit the file and
      # reload (SIGHUP, or the panel's Reload). To edit in the panel instead,
      # keep the configuration in this volume and leave the secret out.
      - unladen-state:/data

    # Nothing in the image needs a capability or a set-uid helper.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

secrets:
  configuration:
    file: ./unladen.jsonc

volumes:
  unladen-state:
